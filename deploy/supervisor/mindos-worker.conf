; /etc/supervisor/conf.d/mindos-worker.conf
;
; OPTIONAL. Mind OS currently has no queued jobs, so this worker is only
; needed once something implements ShouldQueue. The program name is unique,
; and `supervisorctl reread && supervisorctl update` starts only new or
; changed programs — other projects' workers are not restarted.

[program:mindos-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/mindos.mooda.id/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/mindos.mooda.id
user=mindos
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/mindos.mooda.id/storage/logs/worker.log
