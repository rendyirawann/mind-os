; /etc/php/8.3/fpm/pool.d/mindos.conf
;
; Dedicated PHP-FPM pool for Mind OS. Runs as its own Linux user and
; listens on its own socket, so it cannot read other projects' files and a
; crash or overload here does not take other sites' workers with it.
;
; Adjust "8.3" in the path and socket name to the PHP version installed.
; Apply: php-fpm8.3 -t && systemctl reload php8.3-fpm   (graceful reload)

[mindos]
user = mindos
group = mindos

listen = /run/php/php8.3-fpm-mindos.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Hand the real environment to Laravel only through .env.
clear_env = yes

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 60
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
