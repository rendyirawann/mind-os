# /etc/nginx/sites-available/mindos.mooda.id
#
# Self-contained server block for Mind OS. It only answers for
# mindos.mooda.id, uses its own log files, its own TLS session cache zone
# and its own PHP-FPM socket, so no other site on this server is affected.
#
# Enable:  ln -s /etc/nginx/sites-available/mindos.mooda.id /etc/nginx/sites-enabled/
# Check:   nginx -t            (always before reloading)
# Apply:   systemctl reload nginx   (graceful — other sites keep serving)

# --- HTTP: ACME challenge + redirect to HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mindos.mooda.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mindos.mooda.id/public;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    # On nginx >= 1.25.1 you may replace "http2" here with a separate
    # "http2 on;" line; both forms work.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mindos.mooda.id;

    root /var/www/mindos.mooda.id/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mindos.mooda.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindos.mooda.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Zone name is unique to this site so it never clashes with another
    # server block that defines its own shared cache.
    ssl_session_cache shared:mindos_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/mindos.mooda.id.access.log;
    error_log  /var/log/nginx/mindos.mooda.id.error.log warn;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # Hidden files (.env, .git, ...) are never served.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Static assets are served by nginx directly, so Laravel's
    # SecurityHeaders middleware never sees them: add the baseline headers
    # and a long cache here. Nothing is blocked — only cached.
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|mp3|mp4|webm|webmanifest)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Everything else goes through Laravel (pages, sitemap.xml, robots.txt).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm-mindos.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file under public/ may be executed.
    location ~ \.php$ {
        return 404;
    }
}
